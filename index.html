<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kuch Toh Hai...</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Montserrat:wght@300&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            overflow: hidden;
            background:
                radial-gradient(circle at 75% 20%, rgba(255, 214, 145, 0.08), transparent 25%),
                radial-gradient(circle at 20% 80%, rgba(90, 100, 180, 0.12), transparent 30%),
                linear-gradient(135deg, #050611, #101326 50%, #080914);

            color: white;
            font-family: 'Cormorant Garamond', serif;
        }

        /* Stars */
        .stars {
            position: fixed;
            inset: 0;
            pointer-events: none;
        }

        .star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: white;
            border-radius: 50%;
            opacity: 0.5;
            animation: twinkle 3s infinite ease-in-out;
        }

        @keyframes twinkle {
            0%, 100% {
                opacity: 0.15;
            }

            50% {
                opacity: 0.9;
            }
        }

        /* Moon */
        .moon {
            position: absolute;
            top: 9%;
            right: 10%;
            width: 125px;
            height: 125px;

            border-radius: 50%;

            background:
                radial-gradient(circle at 35% 35%, #fff8dc, #f6dfaa 55%, #d9b978);

            box-shadow:
                0 0 30px rgba(255, 226, 164, 0.25),
                0 0 90px rgba(255, 220, 150, 0.12);

            animation: moonGlow 5s ease-in-out infinite;
        }

        @keyframes moonGlow {
            0%, 100% {
                box-shadow:
                    0 0 30px rgba(255, 226, 164, 0.25),
                    0 0 90px rgba(255, 220, 150, 0.12);
            }

            50% {
                box-shadow:
                    0 0 45px rgba(255, 226, 164, 0.35),
                    0 0 120px rgba(255, 220, 150, 0.16);
            }
        }

        /* Main */
        .container {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        .poetry {
            position: relative;
            z-index: 2;
            animation: appear 2.5s ease forwards;
            opacity: 0;
            transform: translateY(20px);
        }

        @keyframes appear {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .line {
            font-size: clamp(35px, 5vw, 72px);
            font-weight: 400;
            letter-spacing: 1px;
            line-height: 1.25;

            text-shadow:
                0 0 20px rgba(255,255,255,0.08);
        }

        .line:nth-child(2) {
            margin-top: 12px;
            color: #d8b98a;
        }

        /* Divider */
        .divider {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 18px;
            margin-top: 35px;
            opacity: 0.7;
        }

        .divider span {
            width: 65px;
            height: 1px;
            background: rgba(255,255,255,0.5);
        }

        .heart {
            font-size: 20px;
            animation: heartbeat 2s infinite;
        }

        @keyframes heartbeat {
            0%, 100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.2);
            }
        }

        /* Bottom glow */
        .glow {
            position: absolute;
            bottom: -150px;
            left: 50%;
            transform: translateX(-50%);

            width: 600px;
            height: 300px;

            background: rgba(87, 95, 170, 0.12);
            filter: blur(90px);
            border-radius: 50%;
        }

        /* Small subtitle */
        .hint {
            position: absolute;
            bottom: 35px;
            left: 50%;
            transform: translateX(-50%);

            font-family: 'Montserrat', sans-serif;
            font-size: 10px;
            letter-spacing: 4px;
            text-transform: uppercase;

            color: rgba(255,255,255,0.28);
        }

        @media (max-width: 600px) {

            .moon {
                width: 80px;
                height: 80px;
                top: 8%;
                right: 8%;
            }

            .line {
                font-size: 36px;
            }

            .divider span {
                width: 40px;
            }
        }
    </style>
</head>

<body>

    <!-- Stars -->
    <div class="stars" id="stars"></div>

    <!-- Moon -->
    <div class="moon"></div>

    <!-- Bottom glow -->
    <div class="glow"></div>

    <!-- Poetry -->
    <main class="container">

        <div class="poetry">

            <div class="line">
                Kuch toh hai jo neend aaye kam
            </div>

            <div class="line">
                Kuch toh hai jo aankhe hai nam
            </div>

            <div class="divider">
                <span></span>
                <div class="heart">♡</div>
                <span></span>
            </div>

        </div>

    </main>

    <div class="hint">
        some feelings need no words
    </div>


    <script>

        // Create random stars
        const starsContainer = document.getElementById("stars");

        for (let i = 0; i < 100; i++) {

            const star = document.createElement("div");

            star.classList.add("star");

            star.style.left = Math.random() * 100 + "%";
            star.style.top = Math.random() * 100 + "%";

            star.style.animationDelay =
                Math.random() * 4 + "s";

            star.style.animationDuration =
                2 + Math.random() * 4 + "s";

            starsContainer.appendChild(star);
        }


        // Very subtle mouse movement
        document.addEventListener("mousemove", (e) => {

            const x = (e.clientX / window.innerWidth - 0.5) * 10;
            const y = (e.clientY / window.innerHeight - 0.5) * 10;

            document.querySelector(".moon").style.transform =
                `translate(${x}px, ${y}px)`;

            document.querySelector(".poetry").style.transform =
                `translate(${x * 0.3}px, ${y * 0.3}px)`;
        });

    </script>

</body>
</html>
